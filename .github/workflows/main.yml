name: Tägliches Aktien-Update

on:
  schedule:
    # Täglich um 18:00 Uhr UTC
    - cron: '0 18 * * *'
  workflow_dispatch: # Erlaubt das manuelle Starten unter "Actions"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm ci || npm install

      - name: Aktien-Screener ausführen
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: npm run update

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
