<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1722" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aktien">
  <meta name="robots" content="noindex, nofollow">
  <title>Aktien-Screener</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Hauptmenü"></nav>
    <div class="main">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Aktien</span></div>
        <div class="updated" id="updated" aria-live="polite"></div>
        <button class="icon-btn" id="refreshBtn" aria-label="Jetzt aktualisieren" title="Jetzt aktualisieren"></button>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü öffnen"></button>
      </header>
      <div id="banners"></div>
      <main id="view" tabindex="-1"></main>
      <footer class="disclaimer">
        Keine Anlageberatung. Vergangene Ergebnisse garantieren nichts. Du handelst auf eigenes Risiko.
      </footer>
    </div>
  </div>
  <dialog id="sheet" class="sheet"></dialog>
  <script src="vendor/lightweight-charts.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
